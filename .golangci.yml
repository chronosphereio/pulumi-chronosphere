version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - copyloopvar
    - revive
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: hash/fnv
              desc: use github.com/cespare/xxhash/v2
            - pkg: github.com/sirupsen/logrus
              desc: logging is allowed only by logutils.Log
            - pkg: github.com/tj/assert
              desc: use github.com/stretchr/testify/assert
            - pkg: github.com/golang/protobuf/jsonpb
              desc: replace with github.com/gogo/protobuf/jsonpb
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 10
    govet:
      enable:
        - shadow
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
      ignore-rules:
        - someword
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    revive:
      rules:
        - name: exported
          arguments:
            - sayRepetitiveInsteadOfStutters
    thelper:
      test:
        first: true
        name: true
        begin: true
      benchmark:
        first: true
        name: true
        begin: true
      tb:
        first: true
        name: false
        begin: true
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - errcheck
          - govet
          - revive
        path: src/pkg/prometheus/
      - linters:
          - errcheck
          - govet
          - revive
        path: src/pkg/alertmanager/
      - path: (.+)\.go$
        text: Using the variable on range scope `tt` in function literal
      - path: (.+)\.go$
        text: Using the variable on range scope `test` in function literal
      - path: (.+)\.go$
        text: 'shadow: declaration of "err" shadows declaration'
      - path: (.+)\.go$
        text: Profiling endpoint is automatically exposed on /debug/pprof
      - path: (.+)\.go$
        text: 'Blacklisted import `crypto/md5`: weak cryptographic primitive'
      - path: (.+)\.go$
        text: Error return value of `\(github.com\/go-kit\/kit\/log.Logger\).Log` is not checked
      - path: (.+)\.go$
        text: Error return value of `[a-zA-Z.]+.Body.Close` is not checked
      - path: (.+)\.go$
        text: 'G104: Errors unhandled'
      - path: (.+)\.go$
        text: package name delete has same name as predeclared identifier
    paths:
      - generated
      - thirdparty
      - instrument
      - scripts
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - generated
      - thirdparty
      - instrument
      - scripts
      - third_party$
      - builtin$
      - examples$
